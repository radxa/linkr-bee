name: Build firmware

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-${{ gitea.ref }}
  cancel-in-progress: true

env:
  BOARD: esp32c3_supermini

jobs:
  firmware:
    name: ESP32-C3 Super Mini
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          path: app

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y cmake ninja-build device-tree-compiler

      - name: Set up Zephyr workspace
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: app
          sdk-version: 1.0.1
          toolchains: riscv64-zephyr-elf
          enable-ccache: false

      - name: Fetch Espressif firmware blobs
        run: west blobs fetch hal_espressif

      - name: Build firmware
        shell: bash
        run: |
          set -euo pipefail
          west build -p always -b "${BOARD}" \
            -d "${GITHUB_WORKSPACE}/app/build" "${GITHUB_WORKSPACE}/app"

      - name: Verify default feature set
        shell: bash
        run: |
          set -euo pipefail
          config="${GITHUB_WORKSPACE}/app/build/zephyr/.config"
          grep -qx 'CONFIG_LINKR_BLE_BRIDGE_WIFI=y' "${config}"
          grep -qx 'CONFIG_WIFI=y' "${config}"
          grep -qx 'CONFIG_NETWORKING=y' "${config}"
          grep -qx 'CONFIG_NET_TCP=y' "${config}"
          grep -qx 'CONFIG_HTTP_SERVER=y' "${config}"
          grep -qx 'CONFIG_HTTP_SERVER_WEBSOCKET=y' "${config}"
          grep -qx 'CONFIG_ZVFS_EVENTFD_MAX=2' "${config}"
          grep -qx 'CONFIG_BT=y' "${config}"
          grep -qx 'CONFIG_BUILD_OUTPUT_BIN=y' "${config}"

      - name: Package firmware
        shell: bash
        run: |
          set -euo pipefail
          output="${GITHUB_WORKSPACE}/app/dist"
          zephyr="${GITHUB_WORKSPACE}/app/build/zephyr"
          rm -rf "${output}"
          mkdir -p "${output}"

          cp "${zephyr}/zephyr.bin" \
            "${output}/linkr-ble-esp32c3-supermini.bin"
          cp "${zephyr}/zephyr.elf" \
            "${output}/linkr-ble-esp32c3-supermini.elf"
          cp "${zephyr}/zephyr.map" \
            "${output}/linkr-ble-esp32c3-supermini.map"
          cp "${zephyr}/.config" "${output}/firmware.config"
          cp "${zephyr}/runners.yaml" "${output}/runners.yaml"
          cp "${GITHUB_WORKSPACE}/app/tools/flash_firmware.sh" \
            "${output}/flash_firmware.sh"
          chmod +x "${output}/flash_firmware.sh"

          cd "${output}"
          sha256sum linkr-ble-esp32c3-supermini.bin > SHA256SUMS
          version="$(sed -n 's/^CONFIG_LINKR_BLE_BRIDGE_FIRMWARE_VERSION=\"\\(.*\\)\"/\\1/p' firmware.config)"
          cat > firmware.json <<EOF
          {
            "project": "linkr-ble",
            "version": "${version}",
            "board": "esp32c3_supermini",
            "chip": "esp32c3",
            "flash_address": "0x0",
            "image": "linkr-ble-esp32c3-supermini.bin",
            "git_commit": "${GITHUB_SHA}"
          }
          EOF
          cat > FLASHING.txt <<'EOF'
          macOS / Linux:
            ./flash_firmware.sh

          Select a port explicitly when more than one device is connected:
            ./flash_firmware.sh --port /dev/cu.usbmodemXXXX

          The script preserves the settings partition. GPIO0 + GND factory
          reset remains the supported way to clear owner and configuration.
          EOF

      - name: Upload firmware
        uses: actions/upload-artifact@v3
        with:
          name: linkr-ble-esp32c3-supermini
          path: app/dist/
          if-no-files-found: error
          retention-days: 30
