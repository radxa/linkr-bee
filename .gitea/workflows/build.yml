name: Build firmware

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-${{ gitea.ref }}
  cancel-in-progress: true

env:
  BOARD: esp32c3_supermini
  ZEPHYR_VERSION: v4.4.1
  ZEPHYR_TOOLCHAIN_VARIANT: zephyr
  ZEPHYR_SDK_INSTALL_DIR: /opt/toolchains/zephyr-sdk-1.0.1

jobs:
  firmware:
    name: ESP32-C3 Super Mini
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ghcr.io/zephyrproject-rtos/ci:v0.29.1
      options: --entrypoint /bin/bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare Zephyr workspace
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"

          workspace="${RUNNER_TEMP:-/tmp}/zephyrproject"
          rm -rf "${workspace}"
          west init -m https://github.com/zephyrproject-rtos/zephyr.git \
            --mr "${ZEPHYR_VERSION}" "${workspace}"
          cd "${workspace}"
          west update --narrow hal_espressif mbedtls tf-psa-crypto
          west blobs fetch hal_espressif
          west zephyr-export

      - name: Build firmware
        shell: bash
        run: |
          set -euo pipefail
          workspace="${RUNNER_TEMP:-/tmp}/zephyrproject"
          cd "${workspace}"
          west build -p always -b "${BOARD}" \
            -d "${GITHUB_WORKSPACE}/build" "${GITHUB_WORKSPACE}"

      - name: Verify default feature set
        shell: bash
        run: |
          set -euo pipefail
          config="${GITHUB_WORKSPACE}/build/zephyr/.config"
          grep -qx 'CONFIG_LINKR_BLE_BRIDGE_WIFI=y' "${config}"
          grep -qx 'CONFIG_WIFI=y' "${config}"
          grep -qx 'CONFIG_NETWORKING=y' "${config}"
          grep -qx 'CONFIG_BT=y' "${config}"
          grep -qx 'CONFIG_BUILD_OUTPUT_BIN=y' "${config}"

      - name: Package firmware
        shell: bash
        run: |
          set -euo pipefail
          output="${GITHUB_WORKSPACE}/dist"
          zephyr="${GITHUB_WORKSPACE}/build/zephyr"
          rm -rf "${output}"
          mkdir -p "${output}"

          cp "${zephyr}/zephyr.bin" \
            "${output}/linkr-ble-esp32c3-supermini.bin"
          cp "${zephyr}/zephyr.elf" \
            "${output}/linkr-ble-esp32c3-supermini.elf"
          cp "${zephyr}/zephyr.map" \
            "${output}/linkr-ble-esp32c3-supermini.map"
          cp "${zephyr}/.config" "${output}/firmware.config"
          cp "${zephyr}/runners.yaml" "${output}/runners.yaml"

          cd "${output}"
          sha256sum linkr-ble-esp32c3-supermini.bin > SHA256SUMS

      - name: Upload firmware
        uses: actions/upload-artifact@v3
        with:
          name: linkr-ble-esp32c3-supermini
          path: dist/
          if-no-files-found: error
          retention-days: 30
