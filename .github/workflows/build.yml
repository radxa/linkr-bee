name: Build and test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  # Tag-driven project releases call this workflow from release.yml, so the
  # tag does not start a second, competing copy of the firmware and APK builds.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: Host regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Install everything the host tests need before they run:
      #  * libdbus-1-dev, because tests/test_terminal_cli_c.py builds the shipped
      #    C reference client with -Werror, and skips itself without it;
      #  * fish and zsh, because the completion tests check the generated scripts
      #    with the real shells, and skip themselves where those are absent.
      - name: Install the test dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y libdbus-1-dev pkg-config fish zsh
      - run: python3 -m unittest discover -s tests -v
      - name: Build the C reference terminal
        run: make -C tools clean all
      - name: Check the helper scripts
        run: |
          set -euo pipefail
          python3 -m compileall -q tools/linkr_ble_terminal.py
          sh -n tools/serve_web.sh
          sh -n tools/build_agent_bundle.sh
          sh -n tools/flash_firmware.sh
          sh -n tools/build_terminal_binary.sh
          sh -n tools/verify.sh
          node --check tools/extract_macaron_cursors.mjs

  mobile:
    name: Web and mobile
    runs-on: ubuntu-latest
    # The Playwright browser download is the slow step; ten minutes is not
    # enough on a loaded runner, and a cancelled job looks like a test failure.
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run bridge tests
        run: npm test

      - name: Install browser test runtime
        run: npx playwright install --with-deps chromium

      - name: Run terminal browser regressions
        run: npm run test:browser

      - name: Build Android and iOS web assets
        run: npm run build

      # The bundle inlines this module, so the built tree no longer carries the
      # file the release assembler reads its version from. Copy the source
      # manifest into the artifact; it is the version the build used.
      - name: Record the shipped Web version
        run: cp ../web/about-data.js dist/about-data.js

      - name: Build HarmonyOS web assets
        run: npm run build:harmony

      - name: Upload the web package
        uses: actions/upload-artifact@v4
        with:
          name: linkr-bee-web
          path: mobile/dist/
          if-no-files-found: error
          retention-days: 30

  # A debug APK of the Capacitor shell. `mobile` above only proves the web
  # assets compile; this is the half that catches a broken native resource, a
  # Gradle/AGP mismatch or a `cap sync` that stopped copying the bundle.
  # The APK is unsigned (Gradle's debug keystore): installable and testable,
  # not publishable. A signed release needs a keystore in repository secrets.
  apk:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # AGP 8.13 requires 17+; the toolchain compiles for 21.
          java-version: "21"

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/android/**/*.gradle', 'mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Build the web assets Capacitor wraps
        run: npm run build

      - name: Copy them into the Android project
        run: npx cap sync android

      - name: Build the debug APK
        run: ./gradlew --no-daemon assembleDebug
        working-directory: mobile/android

      - name: Check the version the APK carries, then name it
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          test -n "${version}"
          # package.json decides the new file name, but the installed app
          # reports versionName from build.gradle. Read the built APK itself so
          # those two cannot drift into a release named for a version it does
          # not carry.
          aapt="$(find "${ANDROID_HOME}/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -x "${aapt}"
          built="$("${aapt}" dump badging android/app/build/outputs/apk/debug/app-debug.apk \
            | sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p")"
          if [ "${built}" != "${version}" ]; then
            echo "APK versionName '${built}' does not match package.json '${version}'" >&2
            exit 1
          fi
          cp android/app/build/outputs/apk/debug/app-debug.apk \
            "android/app/build/outputs/apk/debug/linkr-bee-v${version}-android-debug.apk"

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: linkr-bee-apk
          path: mobile/android/app/build/outputs/apk/debug/linkr-bee-*.apk
          if-no-files-found: error
          retention-days: 30

  firmware:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ESP32-C3 Super Mini
            board: esp32c3_supermini
            slug: esp32c3-supermini
            chip: esp32c3
            toolchain: riscv64-zephyr-elf
            flash_address: "0x0"
            factory_reset: GPIO0 to GND for two seconds during boot
          - name: ESP32-C3 DevKitM
            board: esp32c3_devkitm
            slug: esp32c3-devkitm
            chip: esp32c3
            toolchain: riscv64-zephyr-elf
            flash_address: "0x0"
            factory_reset: GPIO0 to GND for two seconds during boot
          - name: ESP32-C3 DevKitC
            board: esp32c3_devkitc
            slug: esp32c3-devkitc
            chip: esp32c3
            toolchain: riscv64-zephyr-elf
            flash_address: "0x0"
            factory_reset: GPIO0 to GND for two seconds during boot
          - name: Linkr Bee X1.0 (MV013)
            board: linkr_bee_x1_0
            slug: linkr-bee-x1-0
            chip: esp32c3
            toolchain: riscv64-zephyr-elf
            flash_address: "0x0"
            factory_reset: USER_KEY (GPIO3) to GND for two seconds during boot
          - name: ESP32-C5 DevKitC
            board: esp32c5_devkitc/esp32c5/hpcore
            slug: esp32c5-devkitc
            chip: esp32c5
            toolchain: riscv64-zephyr-elf
            flash_address: "0x2000"
            factory_reset: GPIO28 BOOT to GND for two seconds during boot
            expect_psram: "y"
          - name: ESP32-WROOM-32 DevKitC
            board: esp32_devkitc/esp32/procpu
            slug: esp32-wroom-32
            chip: esp32
            toolchain: xtensa-espressif_esp32_zephyr-elf
            flash_address: "0x1000"
            factory_reset: GPIO27 to GND via external jumper

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          path: app

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y cmake ninja-build device-tree-compiler

      - name: Set up Zephyr workspace
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: app
          sdk-version: 1.0.1
          toolchains: ${{ matrix.toolchain }}
          enable-ccache: false

      - name: Fetch Espressif firmware blobs
        shell: bash
        run: |
          set -euo pipefail
          # raw.githubusercontent.com intermittently answers 5xx; one miss used
          # to fail the whole firmware job, so retry before giving up.
          for attempt in 1 2 3; do
            if west blobs fetch hal_espressif; then
              exit 0
            fi
            echo "blob fetch attempt ${attempt} failed; retrying in 20s" >&2
            sleep 20
          done
          echo "blob fetch failed after 3 attempts" >&2
          exit 1

      - name: Build firmware
        shell: bash
        run: |
          set -euo pipefail
          west build -p always -b "${{ matrix.board }}" \
            -d "${GITHUB_WORKSPACE}/app/build" "${GITHUB_WORKSPACE}/app"

      - name: Verify default feature set
        shell: bash
        run: |
          set -euo pipefail
          config="${GITHUB_WORKSPACE}/app/build/zephyr/.config"
          grep -qx 'CONFIG_LINKR_BLE_BRIDGE_WIFI=y' "${config}"
          grep -qx 'CONFIG_LINKR_BLE_BRIDGE_WIFI_OPERATION_TIMEOUT_MS=30000' "${config}"
          grep -qx 'CONFIG_LINKR_BLE_BRIDGE_WATCHDOG=y' "${config}"
          grep -qx 'CONFIG_LINKR_BLE_BRIDGE_WATCHDOG_TIMEOUT_MS=60000' "${config}"
          grep -qx 'CONFIG_WATCHDOG=y' "${config}"
          grep -qx 'CONFIG_WDT_ESP32=y' "${config}"
          grep -qx 'CONFIG_TASK_WDT=y' "${config}"
          grep -qx 'CONFIG_TASK_WDT_HW_FALLBACK=y' "${config}"
          grep -qx 'CONFIG_TASK_WDT_CHANNELS=6' "${config}"
          grep -qx 'CONFIG_TASK_WDT_MIN_TIMEOUT=5000' "${config}"
          grep -qx 'CONFIG_TASK_WDT_HW_FALLBACK_DELAY=5000' "${config}"
          grep -qx '# CONFIG_TASK_WDT_DUMMY is not set' "${config}"
          if grep -qx 'CONFIG_SOC_SERIES_ESP32=y' "${config}"; then
            grep -qx '# CONFIG_LINKR_BLE_BRIDGE_WEBDAV is not set' "${config}"
          else
            grep -qx 'CONFIG_LINKR_BLE_BRIDGE_WEBDAV=y' "${config}"
          fi
          grep -qx 'CONFIG_LINKR_BLE_BRIDGE_WS_BRIDGE=y' "${config}"
          grep -qx 'CONFIG_LINKR_BLE_BRIDGE_UART_RX_DROP_NO_CONN=y' "${config}"
          grep -qx 'CONFIG_WIFI=y' "${config}"
          grep -qx 'CONFIG_NETWORKING=y' "${config}"
          grep -qx 'CONFIG_NET_TCP=y' "${config}"
          grep -qx '# CONFIG_NET_IPV6 is not set' "${config}"
          grep -qx 'CONFIG_HTTP_SERVER=y' "${config}"
          grep -qx 'CONFIG_HTTP_SERVER_VERSION_1=y' "${config}"
          grep -qx '# CONFIG_HTTP_SERVER_VERSION_2 is not set' "${config}"
          grep -qx 'CONFIG_HTTP_SERVER_WEBSOCKET=y' "${config}"
          grep -qx 'CONFIG_ZVFS_EVENTFD_MAX=2' "${config}"
          grep -qx 'CONFIG_BT=y' "${config}"
          # Every released board must expose the runtime BLE-name command.
          # The default is y in Kconfig, and the board files also say so; this
          # guard catches a board overlay or a future config that turns it off.
          grep -qx 'CONFIG_LINKR_BLE_BRIDGE_BLE_NAME_FROM_MAC=y' "${config}"
          grep -qx 'CONFIG_BT_DEVICE_NAME_DYNAMIC=y' "${config}"
          grep -qx 'CONFIG_BT_DEVICE_NAME_MAX=29' "${config}"
          # Keep the firmware guard on the same version as the rest of the
          # tree; a hard-coded number would fail the first CI run after a
          # bump.  The release assembler still checks the tag against it.
          firmware_version="$(python3 -c \
            'import json; print(json.load(open("app/mobile/package.json"))["version"])')"
          grep -qx "CONFIG_LINKR_BLE_BRIDGE_FIRMWARE_VERSION=\"${firmware_version}\"" "${config}"
          grep -qx 'CONFIG_BT_SMP=y' "${config}"
          if grep -Eq '^CONFIG_SOC_SERIES_ESP32(C3|C5)=y$' "${config}"; then
            grep -qx 'CONFIG_LINKR_BLE_BRIDGE_PAIRING_GPIO_AUTH=y' "${config}"
          fi
          grep -qx 'CONFIG_BT_SMP_APP_PAIRING_ACCEPT=y' "${config}"
          grep -qx 'CONFIG_BT_BONDING_REQUIRED=y' "${config}"
          grep -qx 'CONFIG_BT_SETTINGS=y' "${config}"
          grep -qx 'CONFIG_BT_SMP_SC_PAIR_ONLY=y' "${config}"
          grep -qx 'CONFIG_BT_MAX_PAIRED=8' "${config}"
          grep -qx '# CONFIG_BT_KEYS_OVERWRITE_OLDEST is not set' "${config}"
          grep -qx '# CONFIG_BT_ZEPHYR_NUS_DEFAULT_INSTANCE is not set' "${config}"
          grep -qx 'CONFIG_BUILD_OUTPUT_BIN=y' "${config}"
          # Controller-side pairing support differs per Espressif generation:
          # C3 uses the legacy ESP32_BT_CTLR_* menu, C5 the newer
          # ESP32_BT_LE_* menu. Without these the controller has no Security
          # Manager while every Linkr GATT attribute requires encryption.
          if grep -qx 'CONFIG_SOC_SERIES_ESP32C3=y' "${config}"; then
            grep -qx 'CONFIG_ESP32_BT_CTLR_LE_SECURITY_ENABLE=y' "${config}"
          fi
          if grep -qx 'CONFIG_SOC_SERIES_ESP32C5=y' "${config}"; then
            grep -qx 'CONFIG_ESP32_BT_LE_SECURITY_ENABLE=y' "${config}"
            grep -qx 'CONFIG_ESP32_BT_LE_SM_SC=y' "${config}"
            grep -qx '# CONFIG_ESP32_BT_LE_SM_LEGACY is not set' "${config}"
            grep -qx 'CONFIG_ESP32_BT_LE_LL_CFG_FEAT_LE_ENCRYPTION=y' "${config}"
            grep -qx 'CONFIG_ESP32_BT_LE_CRYPTO_STACK_MBEDTLS=y' "${config}"
          fi
          if grep -qx 'CONFIG_SOC_SERIES_ESP32=y' "${config}"; then
            grep -qx 'CONFIG_ESP32_BT_CTLR_LE_SECURITY_ENABLE=y' "${config}"
          fi
          # PSRAM layout. The released C5 image runs with the module's 8 MB
          # part enabled and must keep the WiFi heap, the WiFi packet buffers
          # and the ROM region above DRAM_SHARED_BUFFERS_END out of it.
          if [ "${{ matrix.expect_psram }}" = "y" ]; then
            grep -qx 'CONFIG_ESP_SPIRAM=y' "${config}"
            grep -qx 'CONFIG_ESP_SPIRAM_SIZE=8388608' "${config}"
            grep -qx 'CONFIG_SPIRAM_TYPE_ESPPSRAM64=y' "${config}"
            grep -qx 'CONFIG_SPIRAM_SPEED_80M=y' "${config}"
            grep -qx '# CONFIG_ESP_SPIRAM_MEMTEST is not set' "${config}"
            grep -qx 'CONFIG_ESP_WIFI_HEAP_SYSTEM=y' "${config}"
            grep -qx '# CONFIG_ESP_WIFI_HEAP_SPIRAM is not set' "${config}"
            grep -qx '# CONFIG_ESP32_WIFI_NET_ALLOC_SPIRAM is not set' "${config}"
          fi

      - name: Package firmware
        shell: bash
        run: |
          set -euo pipefail
          output="${GITHUB_WORKSPACE}/app/dist"
          zephyr="${GITHUB_WORKSPACE}/app/build/zephyr"
          python3 "${GITHUB_WORKSPACE}/app/tools/esp_simpleboot_image.py" --check "${zephyr}/zephyr.bin"
          rm -rf "${output}"
          mkdir -p "${output}"

          cp "${zephyr}/zephyr.bin" \
            "${output}/linkr-bee-${{ matrix.slug }}.bin"
          cp "${zephyr}/zephyr.elf" \
            "${output}/linkr-bee-${{ matrix.slug }}.elf"
          cp "${zephyr}/zephyr.map" \
            "${output}/linkr-bee-${{ matrix.slug }}.map"
          cp "${zephyr}/.config" "${output}/firmware.config"
          cp "${zephyr}/runners.yaml" "${output}/runners.yaml"
          cp "${GITHUB_WORKSPACE}/app/tools/flash_firmware.sh" \
            "${output}/flash_firmware.sh"
          chmod +x "${output}/flash_firmware.sh"

          cd "${output}"
          sha256sum "linkr-bee-${{ matrix.slug }}.bin" > SHA256SUMS
          version="$(sed -n 's/^CONFIG_LINKR_BLE_BRIDGE_FIRMWARE_VERSION=\"\([^\"]*\)\"$/\1/p' firmware.config)"
          test -n "${version}"
          cat > firmware.json <<EOF
          {
            "project": "linkr-bee",
            "version": "${version}",
            "board": "${{ matrix.board }}",
            "chip": "${{ matrix.chip }}",
            "flash_address": "${{ matrix.flash_address }}",
            "image": "linkr-bee-${{ matrix.slug }}.bin",
            "git_commit": "${GITHUB_SHA}"
          }
          EOF
          cat > FLASHING.txt <<'EOF'
          macOS / Linux:
            ./flash_firmware.sh --image linkr-bee-${{ matrix.slug }}.bin

          Select a port explicitly when more than one device is connected:
            ./flash_firmware.sh --image linkr-bee-${{ matrix.slug }}.bin --port /dev/cu.usbmodemXXXX

          The script preserves the settings partition.
          Factory reset: ${{ matrix.factory_reset }}.
          EOF

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: linkr-bee-${{ matrix.slug }}
          path: app/dist/
          if-no-files-found: error
          retention-days: 30
