name: Deploy the web terminal to GitHub Pages

# The plain web terminal (web/) is a self-contained static site: no backend, no
# build step, all asset references relative. Publishing it is therefore a copy,
# and the vendored assistant bundle committed under web/vendor/agent is the
# artifact -- it is not rebuilt here, so what is published is exactly what the
# regression suite ran against.
#
# `web/flash/` is the browser flashing page. It is part of the same site (a
# repository has one Pages deployment), but it is a separate page with its own
# entry point at /flash/. Its firmware is not checked in: this workflow copies
# the release bundles into `web/flash/firmware/` and generates the manifests
# with tools/build_flasher.py, so the page always offers the images the release
# actually built.
#
# BLE (Web Bluetooth) needs a secure context, which Pages provides. The LAN
# WebSocket bridge works from here too, but with a warning: an https page that
# opens ws:// is mixed content, and Chromium allows it while marking it
# deprecated ("Insecure access to this endpoint is deprecated"). Measured on
# 2026-09-29 against a ws:// endpoint on a 192.168 address from this exact
# origin: the connection opened, only the warning was printed. The bridge is
# therefore left available; a locally served copy (tools/serve_web.sh) remains
# the way to run it without the warning, and to reach a device when a browser
# does enforce the deprecation.
#
# Requires Settings -> Pages -> Source: "GitHub Actions" once.

on:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - "tools/build_flasher.py"
      - ".github/workflows/pages.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Pages deployments are not worth racing: a cancelled deploy can leave the site
# half-updated, and the site changes at most a few times a day.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish the plain web terminal
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # A release run builds the page from that tag; a push run from whatever
      # GitHub currently calls the latest release. Either way the firmware the
      # page offers is a published artifact, never a local build.
      - name: Resolve the firmware release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "release" ]; then
            tag="${{ github.event.release.tag_name }}"
          else
            tag="$(gh release view --repo "${GITHUB_REPOSITORY}" --json tagName -q .tagName)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download the firmware bundles
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .firmware-release
          gh release download "${{ steps.release.outputs.tag }}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern '*firmware-*.zip' \
            --dir .firmware-release

      # Stage the images beside the page so it fetches them same-origin: release
      # assets do not send the CORS headers a cross-origin fetch would need. The
      # manifest names the tag and repository, and the page falls back to the
      # GitHub API only when this file is absent.
      - name: Stage the flashing page firmware
        run: |
          python3 tools/build_firmware_manifest.py \
            --source .firmware-release \
            --output web/firmware \
            --tag "${{ steps.release.outputs.tag }}" \
            --repo "${GITHUB_REPOSITORY}"

      # Jekyll is skipped for artifacts, but an empty .nojekyll also keeps a
      # future switch to branch-based publishing from silently dropping paths.
      - name: Mark the site as plain static files
        run: touch web/.nojekyll

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
