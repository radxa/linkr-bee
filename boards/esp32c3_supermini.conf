# This board has a pairing key on GPIO1. The Kconfig default is now n, so
# keep the physical authorization the board shipped with.
CONFIG_LINKR_BLE_BRIDGE_PAIRING_GPIO_AUTH=y

# Every board advertises Linkr Bee XXXX; XXXX is the last four hex digits of
# the factory hardware MAC. @n can replace the whole name at runtime.
CONFIG_LINKR_BLE_BRIDGE_BLE_NAME_FROM_MAC=y

# Zephyr 4.5: keep a bounded deferred-log queue within the C3 SRAM budget.
CONFIG_LOG_BUFFER_SIZE=4096
