# ESP32-C5 DevKitC board configuration overlay.
#
# C5 vs C3 differences that need Kconfig tuning:
#  - 8 MB QSPI PSRAM on WROOM-1-N8R4 module (C3 has none)
#  - Tighter internal SRAM; data-only buffers live in PSRAM, see src/ext_ram.h
#  - BLE controller memory sizing differs; cap advertising activity counts
#  - WiFi driver may silently drop CONNECT_RESULT events; watchdog recovers
#  - IPv6 stack is not needed (STA connects to IPv4-only hotspots); it also
#    corrupts the IPv4 config slot pool on this target (see below)

# Production pairing requires GPIO1 to be held low with an external button
# or jumper; GPIO1 is not connected to an onboard key. Bench builds can opt
# out explicitly with dev_c5_open_pairing.conf, never through this default.
CONFIG_LINKR_BLE_BRIDGE_PAIRING_GPIO_AUTH=y

# Every board advertises Linkr Bee XXXX; XXXX is the last four hex digits of
# the factory hardware MAC. @n can replace the whole name at runtime.
CONFIG_LINKR_BLE_BRIDGE_BLE_NAME_FROM_MAC=y

# --- PSRAM (default: enabled) ---------------------------------------------
# The module has 8 MB of QSPI PSRAM and internal SRAM is the binding constraint
# on this target. Data-only buffers are moved into .ext_ram.bss (src/ext_ram.h,
# explained in docs/C5_PSRAM.md) and the sizes that were cut to fit DRAM are
# restored below.
#
# Deliberate constraints, each of them measured on hardware:
#  - 80 MHz only: SPIRAM_SPEED_40M boots into an rst:0x1a CPU_LOCKUP loop.
#  - The WiFi adapter heap and the WiFi packet buffers stay in DRAM
#    (ESP_WIFI_HEAP_SYSTEM, not ESP_WIFI_HEAP_SPIRAM /
#    ESP32_WIFI_NET_ALLOC_SPIRAM): a 2.4 GHz scan took 40 s and never
#    completed with them in PSRAM, against 19.7 s otherwise.
#  - The ROM region above DRAM_SHARED_BUFFERS_END (0x4085C610) is off limits:
#    taking it makes WiFi association hang or lock the chip up.
#  - MEMTEST costs ~100 ms per MB at boot and proves nothing at runtime.
# c5_pure_sram.conf turns all of this off again; that variant is kept as a
# reference and is no longer built by CI (see docs/C5_PSRAM.md section 5).
CONFIG_ESP_SPIRAM=y
CONFIG_SPIRAM_MODE_QUAD=y
CONFIG_SPIRAM_SPEED_80M=y
# 4 MB of the 8 MB part serves shared_multi_heap; the rest stays in reserve.
CONFIG_ESP_SPIRAM_HEAP_SIZE=4194304
CONFIG_ESP_SPIRAM_MEMTEST=n
CONFIG_ESP_WIFI_HEAP_SYSTEM=y
# CONFIG_ESP_WIFI_HEAP_SPIRAM=y
# CONFIG_ESP32_WIFI_NET_ALLOC_SPIRAM=y

# --- BLE controller limits (C5 memory model) ------------------------------
CONFIG_ESP32_BT_LE_MAX_CONNECTIONS=2
CONFIG_ESP32_BT_CTLR_LE_MAX_CONN=2
CONFIG_ESP32_BT_CTLR_LE_MAX_ACT=3
CONFIG_ESP32_BT_LE_LL_DUP_SCAN_LIST_COUNT=5

# --- WiFi scan budget -----------------------------------------------------
# A full sweep on this dual-band part takes about 20 s: the ESP32 WiFi driver
# ignores the requested band bitmap, so 2.4 GHz-only and short per-channel
# dwell requests do not shorten it. The default 15 s bound would release every
# scan just before the driver reports completion.
CONFIG_LINKR_BLE_BRIDGE_WIFI_SCAN_TIMEOUT_MS=30000

# --- Buffer sizing --------------------------------------------------------
# The values below are back at their upstream defaults. The previous image had
# to cut them (1024/4/1024/1024/1024) to stay under DRAM_SHARED_BUFFERS_END
# (0x4085C610), because the 12.8 KB ROM stack/bss region above it belongs to
# the WiFi/PHY code: overrunning it makes association hang and, with PSRAM
# enabled, ends in `rst:0x1a (CPU_LOCKUP)`. Those buffers now either live in
# PSRAM (see src/ext_ram.h) or no longer fit in the budget at all, so the cuts
# are no longer needed.
#
# The UART RX ring stays in DRAM on purpose: it is written from the UART
# interrupt handler, where a QSPI round trip is not acceptable.
# 4096 B, not 2048: this ring is the SBC's first landing zone for bursts and
# is written from the UART interrupt, so it can never move into PSRAM. The
# extra 2 KB buys burst absorption for `ls -R`-sized output at a cost the
# remaining DRAM headroom covers.
CONFIG_LINKR_BLE_BRIDGE_UART_RX_BUFFER_SIZE=4096
CONFIG_LINKR_BLE_BRIDGE_PEER_TX_QUEUE_DEPTH=8
CONFIG_LINKR_BLE_BRIDGE_WS_BRIDGE_CLIENT_BUFFER_SIZE=2048
# One LAN client. Re-tested on Zephyr 4.5 with two configured clients and
# ZVFS_POLL_MAX=5: the second `ws://` is still refused at the TCP layer
# (Windows: WinError 1225 connection refused, firmware: exactly one
# "WS client connected", zero "Rejecting WS client", so linkr_ws_setup() never
# ran). Zephyr's http_server still clears the listening socket's poll events
# once its client budget is used up (http_server_core.c, the accept branch), so
# the second slot only costs 2 KB of DRAM and a lowered client stack budget
# for nothing. Keep 1 until that path is fixed upstream.
CONFIG_LINKR_BLE_BRIDGE_WS_BRIDGE_MAX_CLIENTS=1
CONFIG_ESP32_WIFI_DYNAMIC_RX_MGMT_BUFFER=y
# Disable non-essential features to free SRAM for BLE debug logging
#CONFIG_LINKR_BLE_BRIDGE_WS_BRIDGE=n

# --- Thread stacks (sized from on-device watermarks) ----------------------
# Measured high-water marks on the C5 target: http_server 1592 B (SHA1
# handshake path), sysworkq 1264-1416 B (WiFi scan work, boot items),
# wifi_connect 1320 B (connect + DHCP startup), mgmt_request 2140 B.
# STACK_SENTINEL guards the margin. C3 targets keep the larger defaults,
# which are unmeasured there.
#
# Thread stacks cannot follow the buffers into PSRAM: Zephyr does not support
# stacks in external RAM (exception and context-switch paths touch them).
CONFIG_HTTP_SERVER_STACK_SIZE=3584
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=3584
CONFIG_LINKR_BLE_BRIDGE_WIFI_CONNECT_STACK=3584
# The C3/WROOM default, not the 3072 B this overlay used to cut it to.
# `@linkr bonds?` walks settings -> NVS -> flash inside this thread
# (settings_nvs_load -> nvs_read_hist -> nvs_flash_ate_rd -> z_impl_flash_erase)
# and peaks at 2804 B. At 3072 B that overflow left its own stack, ran into the
# neighbouring `peer_stacks` array (0x40825640) and overwrote the ble_peer_tx
# trap frame -- that thread then resumed with mepc=0 and reset the board.
CONFIG_LINKR_BLE_BRIDGE_MGMT_REQUEST_STACK=4096
# ws_bridge per-client thread: measured watermark 1572 B (sampled while a
# WS client is connected).
CONFIG_LINKR_BLE_BRIDGE_WS_BRIDGE_STACK=3072

# --- App buffers ----------------------------------------------------------
# log_ring and the WebDAV staging chunk are in PSRAM, so both are back at the
# upstream sizes. Management queue slots contain pointers and each queued
# message allocates only its actual payload, so the common WiFi scan burst no
# longer reserves 512 bytes per slot.
CONFIG_LINKR_BLE_BRIDGE_LOG_RING_SIZE=2048
CONFIG_LINKR_BLE_BRIDGE_MGMT_TX_QUEUE_DEPTH=16
CONFIG_LINKR_BLE_BRIDGE_WEBDAV_UPLOAD_CHUNK=4096

# --- Logging (immediate mode saves SRAM) ----------------------------------
CONFIG_LOG_MODE_IMMEDIATE=y

# --- BLE coexistence with WiFi ---------------------------------------------
# Observed on C5: @w=ssid,pass triggers a WiFi scan/connect window during
# which the single radio is held by WiFi; the BLE link receives nothing for
# several seconds and drops with reason 0x08 (connection timeout) ~5 s after
# the connect request. The default peripheral-preferred supervision timeout
# is 42 x 10 ms = 420 ms, far below the WiFi radio-blackout window. Request
# 8 s so the link survives scan + association + 4-way handshake. C3 boards
# keep the default (shorter scans, no observed 0x08).
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=800

# --- BLE info logging (key events only, diagnose 0x08 connection timeout) ---
CONFIG_BT_LOG_LEVEL_INF=y
CONFIG_BT_CONN_LOG_LEVEL_INF=y
CONFIG_BT_HCI_CORE_LOG_LEVEL_INF=y

# --- WiFi Recovery --------------------------------------------------------
CONFIG_LINKR_BLE_BRIDGE_WIFI_RETRY_MS=3000

# --- IPv6: works on this target, but does not fit -------------------------
# IPv6 is functional here as of Zephyr 4.5. Re-tested with it enabled:
# association and DHCP reach phase=ready with ip=192.168.31.99 in 21.7 s,
# ping answers 5/5, and the LAN bridge authenticates, writes and echoes. The
# defect it used to be disabled for is gone -- the init path no longer writes
# ff01:: mcast groups and AF_INET6 records over the adjacent ipv4_addresses[]
# pool, so DHCP claims its config slot normally.
#
# It still has to stay off, purely because it does not fit: +3456 B of DRAM
# (global_data +1656, ND neighbour pool +768, IPv6 routes +544,
# ipv6_addresses +440, protocol contexts +432, RS/RA + MLD + NS timers),
# against the 3472 B this image has left once the UART 4 KB ring and the
# 24-buffer network pools are in. Enabling it links with 16 B to spare and
# only fits after the UART RX ring drops back to 2048 B and the pools to
# 20/10, both of which were raised deliberately -- so IPv6 loses that trade.
# Revisit if DRAM headroom grows (moving ble_mgmt.c's request_queue, ~1 KB,
# into PSRAM is the obvious first step).
CONFIG_NET_IPV6=n

# The DHCPv6 DNS options depend only on DNS_RESOLVER, so they survive
# NET_IPV6=n as dead defaults; disable them for a strictly IPv4 stack.
CONFIG_NET_DHCPV6_OPTION_DNS_ADDRESS=n
CONFIG_NET_DHCPV6_DNS_SERVER_VIA_INTERFACE=n

# --- DHCP ----------------------------------------------------------------
CONFIG_NET_DHCPV4_INITIAL_DELAY_MAX=2
CONFIG_NET_IF_MAX_IPV4_COUNT=2

# --- Debug: heap corruption instrumentation ------------------------------
# Kept commented out by default: with the pure SRAM variant above, enabling
# this section overflows SRAM by ~1792 bytes at link time. Re-enable it when
# building with PSRAM.
#
# Observed failure signature on C5: "WiFi connected" -> "WS bridge start" ->
# "WiFi IPv4 address ready" followed by system freeze; one occurrence reset
# with rst:0x1a (CPU_LOCKUP), Core0 Saved PC decoded to chunk_set()
# (zephyr/lib/heap/heap.h), i.e. the sys_heap allocator spinning on
# corrupted heap metadata. SYS_HEAP_VALIDATE checks every heap on each
# alloc/free so the corruption is caught at the first offending call
# instead of much later inside the allocator. C3 builds are unaffected.
#CONFIG_SYS_HEAP_VALIDATE=y
#CONFIG_THREAD_STACK_INFO=y
#CONFIG_STACK_SENTINEL=y

# Round 2 instrumentation: after reproducing with SYS_HEAP_VALIDATE on,
# the freeze recurred without any heap validation panic, and the board was
# still functional over BLE/UART while the network dataplane (ping/TCP)
# and the log/console output were frozen. The corrupted memory is therefore
# not sys_heap-managed. Thread analyzer dumps thread states periodically
# via printk (direct console path) so the frozen thread(s) can be identified
# after the fault. Net stack logging traces the last events before freeze.
#CONFIG_THREAD_ANALYZER=y
#CONFIG_THREAD_ANALYZER_USE_PRINTK=y
#CONFIG_THREAD_ANALYZER_AUTO=y
#CONFIG_THREAD_ANALYZER_AUTO_INTERVAL=30
#CONFIG_THREAD_ANALYZER_AUTO_STACK_SIZE=2048
#CONFIG_NET_LOG=y
#CONFIG_NET_CORE_LOG_LEVEL_DBG=y
#CONFIG_NET_IF_LOG_LEVEL_DBG=y
#CONFIG_NET_DHCPV4_LOG_LEVEL_DBG=y

# Round 3: the fault reproduced as "every incoming frame discarded by L2"
# right after IPv4 becomes ready while all threads stay alive. Enable the
# ethernet L2 debug logs to capture the exact drop reason ("not for me" vs
# "unknown hdr type"), which distinguishes a corrupted interface link
# address from a corrupted ethertype/header.
#CONFIG_NET_L2_ETHERNET_LOG_LEVEL_DBG=y
#CONFIG_NET_ARP_LOG_LEVEL_DBG=y

# --- SRAM trim (kept from the pure-SRAM era, re-measured with PSRAM) ------
# Zephyr 4.5 uses smaller RF pools and matching heap reservations (36 KiB
# for WiFi and 44000 B for Bluetooth); the pure-SRAM variant is not maintained.
# These resources were cut in db53605 to fit that variant; with PSRAM enabled most of it is
# back at the values used before that commit, and the rest is kept because
# the cost is out of proportion to the benefit (see each item).
#
# Thread stacks: main and the WebDAV uploader are mostly idle (main returns to
# the idle loop after init; the uploader spends its time in a blocking HTTP
# PUT), so the historical 4 KiB is affordable again now that the buffers live
# in PSRAM.
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_LINKR_BLE_BRIDGE_LOG_UPLOAD_STACK=4096
# Twenty-four buffers per direction. The earlier 20 (and the 28 before that)
# were set by whatever DRAM was left, not by a measured need; with the LAN
# client count back at 1 the second client's stack is free again, so the
# headroom goes to HTTP/WebSocket/WebDAV bursts instead. Network buffers and
# stacks stay in DRAM; PSRAM carries application data only.
CONFIG_NET_BUF_RX_COUNT=24
CONFIG_NET_BUF_TX_COUNT=24
# Twelve packet descriptors per direction, in step with the buffers above.
CONFIG_NET_PKT_RX_COUNT=12
CONFIG_NET_PKT_TX_COUNT=12
# WiFi management RX/SBUF rings are the one trim that stays. The defaults are
# 5 RX management buffers and 32 SBUF entries; the SBUF ring is the WiFi
# driver's transmit queue and a 32-entry ring costs ~1.6 KB per entry, i.e.
# ~40 KB more DRAM than the 6 entries we run with. Neither value has been
# observed to limit a scan + connect + DHCP burst, so the memory stays with
# the network stack.
CONFIG_ESP32_WIFI_RX_MGMT_BUF_NUM_DEF=3
CONFIG_ESP32_WIFI_MGMT_SBUF_NUM=6

# --- Zephyr 4.5 RF budget -------------------------------------------------
# Shrink the dynamic WiFi pools before reducing their shared heap reservation:
# six RX/TX buffers bound radio bursts, not the UART capture or PSRAM log ring.
# Keep the adapter heap, network buffers and every stack in internal SRAM.
CONFIG_ESP32_WIFI_DYNAMIC_RX_BUFFER_NUM=6
CONFIG_ESP32_WIFI_DYNAMIC_TX_BUFFER_NUM=6
# Optional speed/power optimizations otherwise copy more WiFi code into SRAM.
CONFIG_ESP32_WIFI_EXTRA_IRAM_OPT=n
CONFIG_ESP32_WIFI_SLP_IRAM_OPT=n
# A 255-byte controller ACL payload carries the configured 251-byte host ACL.
# The smaller controller pools cover both BLE peers and justify the matching
# HEAP_MEM_POOL_ADD_SIZE_ESP_BT default in the application Kconfig.
CONFIG_ESP32_BT_LE_MSYS_2_BLOCK_COUNT=12
CONFIG_ESP32_BT_LE_ACL_BUF_COUNT=8
CONFIG_ESP32_BT_LE_ACL_BUF_SIZE=255
# Keep early warnings/errors; omit boot-only info strings from SRAM.
CONFIG_ESP_HAL_EARLY_LOG_LEVEL=2
