# YD-ESP32-S3 (VCC-GND Studio, ESP32-S3-WROOM-1 N16R8) board configuration.
#
# Bench target for the Linkr Bee firmware: 16 MB flash, 8 MB octal PSRAM,
# 512 KB SRAM. The bridge UART is UART0 on the header (GPIO43 TX / GPIO44 RX),
# which is also the pair the on-board TX/RX LEDs sit on. The console moves to
# the native USB Serial/JTAG port (GPIO19/20) in the overlay.
#
# Pairing does not require a physical press, matching the WROOM bench build.
# The BOOT key (GPIO0) is still described by the overlay as the optional
# pairing input; enable PAIRING_GPIO_AUTH below to require it. GPIO0 is also
# the ROM download strap, so holding it through reset starts the loader and
# this build has no factory-reset key: erase flash over USB instead.
#
# Budget policy: this board has far more RAM than any released C3/C5 target,
# so the limits below are raised to absorb bursts instead of matching the
# smallest board. Data-only buffers are moved to PSRAM through
# src/ext_ram.h; stacks and the UART RX ring stay in internal SRAM because
# Zephyr stacks and interrupt-written rings cannot live in external memory.

# Bench board: no dedicated user key, and the BOOT key doubles as the ROM
# download strap. Pairing therefore works without a press, as on WROOM; set
# this to y to require BOOT before a new host pairs. Existing bonds reconnect
# through the saved LTK either way.
CONFIG_LINKR_BLE_BRIDGE_PAIRING_GPIO_AUTH=n
CONFIG_LINKR_BLE_BRIDGE_BLE_NAME_FROM_MAC=y

# The two single-colour LEDs on the UART0 lines already show bridge traffic,
# so the addressable RGB is a user light here: it stays dark until the @l
# command sets a colour, and that colour is held (no five-second preview).
CONFIG_LINKR_BLE_BRIDGE_RGB_STATUS_LED=y
CONFIG_LINKR_BLE_BRIDGE_RGB_MANUAL_ONLY=y
# The pixel is the large LED on this board and is already bright at the shared
# 30% default; pin the value so a future default change cannot turn the user
# light into a lamp.
CONFIG_LINKR_BLE_BRIDGE_RGB_BRIGHTNESS=30

# The legacy Espressif controller menu (same as C3/WROOM) supplies the
# Security Manager; every Linkr GATT attribute is encryption-only.
CONFIG_ESP32_BT_CTLR_LE_SECURITY_ENABLE=y

# --- PSRAM (8 MB, octal, on the N16R8 module) ------------------------------
# The shared multi-heap starts after .ext_ram.bss and fills the rest of the
# 8 MB part: 7.68 MiB is handed to Zephyr's heap, with ~32 KiB left in reserve
# for the mapped-region bookkeeping. The heap is only capacity: buffers that
# need a fixed home use .ext_ram.bss instead, and nothing is written until it
# is allocated.
#
# As on C5, the WiFi adapter heap and packet buffers stay in internal SRAM:
# moving them to PSRAM made a 2.4 GHz scan take 40 s and never complete. The
# migrated objects here are UART log staging, WiFi credentials, BLE peer/queue
# payloads, the WebDAV chunk and the WebSocket TX rings -- all pure data
# touched only from thread context.
CONFIG_ESP_SPIRAM=y
CONFIG_SPIRAM_MODE_OCT=y
CONFIG_SPIRAM_SPEED_80M=y
# SPIRAM_ALLOW_BSS_SEG_EXTERNAL_MEMORY is a hidden symbol and already defaults
# to y for ESP32-S3 in the HAL Kconfig; assigning it here is rejected.
CONFIG_ESP_SPIRAM_HEAP_SIZE=8049120
CONFIG_ESP_SPIRAM_MEMTEST=n
CONFIG_ESP_WIFI_HEAP_SYSTEM=y
# CONFIG_ESP_WIFI_HEAP_SPIRAM=y
# CONFIG_ESP32_WIFI_NET_ALLOC_SPIRAM=y

# --- BLE controller limits ------------------------------------------------
# Two bonded peers, matching the shared firmware contract. The S3 uses the
# legacy ESP32_BT_CTLR_* menu (same as C3); ESP32_BT_LE_* is C5-and-later.
CONFIG_ESP32_BT_CTLR_LE_MAX_CONN=2
CONFIG_ESP32_BT_CTLR_LE_MAX_ACT=3
CONFIG_BT_BUF_ACL_TX_COUNT=24
CONFIG_BT_BUF_EVT_RX_COUNT=32
CONFIG_BT_RX_STACK_SIZE=3072
CONFIG_BT_TX_PROCESSOR_STACK_SIZE=3072

# --- Application buffers --------------------------------------------------
# UART RX is written from the interrupt handler, so it stays in DRAM. 16 KB
# absorbs a boot-log or `dmesg` burst before the BLE link drains it.
CONFIG_LINKR_BLE_BRIDGE_UART_RX_BUFFER_SIZE=24576
CONFIG_LINKR_BLE_BRIDGE_UART_RX_CHUNK=232
CONFIG_LINKR_BLE_BRIDGE_BLE_TO_UART_QUEUE_DEPTH=32
CONFIG_LINKR_BLE_BRIDGE_PEER_TX_QUEUE_DEPTH=64

# The following payloads live in PSRAM (src/ext_ram.h), so each is at its
# Kconfig maximum: a full WiFi scan burst fits the management queue, the
# WebDAV staging ring holds more than one upload interval of a fast console,
# and a LAN client can fall behind an 115200-baud stream for minutes without
# dropping bytes. RING_BUFFER_LARGE is what lets a ring be larger than 32 KiB.
CONFIG_RING_BUFFER_LARGE=y
CONFIG_LINKR_BLE_BRIDGE_LOG_RING_SIZE=131072
CONFIG_LINKR_BLE_BRIDGE_WEBDAV_UPLOAD_CHUNK=65536
CONFIG_LINKR_BLE_BRIDGE_WS_BRIDGE_CLIENT_BUFFER_SIZE=32768
CONFIG_LINKR_BLE_BRIDGE_MGMT_TX_QUEUE_DEPTH=64

# --- WiFi pools -----------------------------------------------------------
# Modestly larger than the shared defaults; the driver's own buffers stay in
# DRAM on purpose (see the PSRAM note above).
CONFIG_ESP32_WIFI_STATIC_RX_BUFFER_NUM=6
CONFIG_ESP32_WIFI_DYNAMIC_RX_BUFFER_NUM=12
CONFIG_ESP32_WIFI_DYNAMIC_TX_BUFFER_NUM=12
CONFIG_ESP32_WIFI_RX_MGMT_BUF_NUM_DEF=4
CONFIG_ESP32_WIFI_MGMT_SBUF_NUM=8
CONFIG_NET_PKT_RX_COUNT=18
CONFIG_NET_PKT_TX_COUNT=18
CONFIG_NET_BUF_RX_COUNT=48
CONFIG_NET_BUF_TX_COUNT=48

# --- Thread stacks (sized from on-device headroom) ------------------------
# No runtime watermark has been taken on this target yet, so every stack gets
# at least the measured C5 size plus 50% margin. Stacks cannot move to PSRAM:
# Zephyr does not support thread stacks in external RAM.
CONFIG_MAIN_STACK_SIZE=6144
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=2048
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_HTTP_SERVER_STACK_SIZE=5120
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=5120
CONFIG_LINKR_BLE_BRIDGE_WIFI_CONNECT_STACK=5120
CONFIG_LINKR_BLE_BRIDGE_MGMT_REQUEST_STACK=5120
CONFIG_LINKR_BLE_BRIDGE_LOG_UPLOAD_STACK=5120
CONFIG_LINKR_BLE_BRIDGE_WS_BRIDGE_STACK=4096
CONFIG_NET_RX_STACK_SIZE=2048
CONFIG_NET_TX_STACK_SIZE=2048

# --- Link timing ----------------------------------------------------------
# Match the C5/WROOM 8 s supervision timeout: a WiFi association window can
# hold the shared radio longer than the 420 ms default.
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=800
