# Linkr Bee on the ESP32-S3 devkit form factor (YD-ESP32-S3 board).
#
# This is the common configuration: it makes no assumption about external
# PSRAM, so it runs on an ESP32-S3 module with no PSRAM at all as well as on
# an N16R8 module (where the PSRAM then simply stays unused). For the N16R8
# build add the extra fragments:
#
#   west build -b esp32s3_devkitc/esp32s3/procpu linkr-bee -- \
#       -DEXTRA_CONF_FILE=boards/esp32s3_devkitc_esp32s3_procpu_n16r8.conf \
#       -DEXTRA_DTC_OVERLAY_FILE=boards/esp32s3_devkitc_esp32s3_procpu_n16r8.overlay
#
# PSRAM mode (quad/octal), size and heap placement are compile-time values,
# so the 8 MB heap cannot be reused on a 2 MB part. A 2 MB module (N8R2)
# should use this default build; PSRAM support for it would need its own
# fragment with SPIRAM_MODE_QUAD and a ~1.5 MB heap.
#
# Bridge UART1 is on GPIO17 (TX) and GPIO18 (RX). The Zephyr console uses
# the native USB Serial/JTAG port on GPIO19/20.
#
# Pairing does not require a physical press, matching the WROOM bench build.
# The BOOT key (GPIO0) is still described by the overlay as the optional
# pairing input; enable PAIRING_GPIO_AUTH below to require it. GPIO0 is also
# the ROM download strap, so holding it through reset starts the loader and
# this build has no factory-reset key: erase flash over USB instead.

# Bench board: no dedicated user key, and the BOOT key doubles as the ROM
# download strap. Pairing therefore works without a press, as on WROOM; set
# this to y to require BOOT before a new host pairs. Existing bonds reconnect
# through the saved LTK either way.
CONFIG_LINKR_BLE_BRIDGE_PAIRING_GPIO_AUTH=n
CONFIG_LINKR_BLE_BRIDGE_BLE_NAME_FROM_MAC=y

# The GPIO48 pixel stays dark until a management command sets its colour.
CONFIG_LINKR_BLE_BRIDGE_RGB_STATUS_LED=y
CONFIG_LINKR_BLE_BRIDGE_RGB_MANUAL_ONLY=y
# The pixel is the large LED on this board and is already bright at the shared
# 30% default; pin the value so a future default change cannot turn the user
# light into a lamp.
CONFIG_LINKR_BLE_BRIDGE_RGB_BRIGHTNESS=30

# The legacy Espressif controller menu (same as C3/WROOM) supplies the
# Security Manager; every Linkr GATT attribute is encryption-only.
CONFIG_ESP32_BT_CTLR_LE_SECURITY_ENABLE=y

# --- BLE controller limits ------------------------------------------------
# Two bonded peers, matching the shared firmware contract. The S3 uses the
# legacy ESP32_BT_CTLR_* menu (same as C3); ESP32_BT_LE_* is C5-and-later.
CONFIG_ESP32_BT_CTLR_LE_MAX_CONN=2
CONFIG_ESP32_BT_CTLR_LE_MAX_ACT=3
CONFIG_BT_BUF_ACL_TX_COUNT=16
CONFIG_BT_BUF_EVT_RX_COUNT=32
CONFIG_BT_RX_STACK_SIZE=3072
CONFIG_BT_TX_PROCESSOR_STACK_SIZE=3072

# --- Application buffers --------------------------------------------------
# Without PSRAM every buffer lands in the 512 KB of internal SRAM, so these
# stay at the shared defaults (the N16R8 fragment raises them once the data
# buffers can move to external RAM). UART RX is written from the interrupt
# handler, so it stays in DRAM on both variants. 8 KB holds 0.7 s of a
# 115200-baud burst; the N16R8 fragment raises it and the queue depths.
CONFIG_LINKR_BLE_BRIDGE_UART_RX_BUFFER_SIZE=8192
CONFIG_LINKR_BLE_BRIDGE_UART_RX_CHUNK=232
CONFIG_LINKR_BLE_BRIDGE_BLE_TO_UART_QUEUE_DEPTH=16
CONFIG_LINKR_BLE_BRIDGE_PEER_TX_QUEUE_DEPTH=8

# --- WiFi pools -----------------------------------------------------------
# The driver's own buffers stay in DRAM on purpose: moving them to PSRAM on
# the C5 made a 2.4 GHz scan take 40 s and never complete.
CONFIG_ESP32_WIFI_STATIC_RX_BUFFER_NUM=6
CONFIG_ESP32_WIFI_DYNAMIC_RX_BUFFER_NUM=12
CONFIG_ESP32_WIFI_DYNAMIC_TX_BUFFER_NUM=12
CONFIG_ESP32_WIFI_RX_MGMT_BUF_NUM_DEF=4
CONFIG_ESP32_WIFI_MGMT_SBUF_NUM=8
CONFIG_NET_PKT_RX_COUNT=18
CONFIG_NET_PKT_TX_COUNT=18
CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=32

# --- Thread stacks --------------------------------------------------------
# No runtime watermark has been taken on this target yet, so every stack gets
# at least the measured C5 size plus 50% margin. Stacks stay in internal RAM.
CONFIG_MAIN_STACK_SIZE=5120
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=2048
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_HTTP_SERVER_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=5120
CONFIG_LINKR_BLE_BRIDGE_WIFI_CONNECT_STACK=5120
CONFIG_LINKR_BLE_BRIDGE_MGMT_REQUEST_STACK=5120
CONFIG_LINKR_BLE_BRIDGE_LOG_UPLOAD_STACK=5120
CONFIG_LINKR_BLE_BRIDGE_WS_BRIDGE_STACK=4096
CONFIG_NET_RX_STACK_SIZE=2048
CONFIG_NET_TX_STACK_SIZE=2048

# --- Link timing ----------------------------------------------------------
# Match the C5/WROOM 8 s supervision timeout: a WiFi association window can
# hold the shared radio longer than the 420 ms default.
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=800
