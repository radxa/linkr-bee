# Extra configuration for the ESP32-S3-WROOM-1 N16R8 module (16 MB flash,
# 8 MB octal PSRAM), applied on top of esp32s3_devkitc_esp32s3_procpu.conf:
#
#   west build -b esp32s3_devkitc/esp32s3/procpu linkr-bee -- \
#       -DEXTRA_CONF_FILE=boards/esp32s3_devkitc_esp32s3_procpu_n16r8.conf \
#       -DEXTRA_DTC_OVERLAY_FILE=boards/esp32s3_devkitc_esp32s3_procpu_n16r8.overlay
#
# The matching overlay declares the 16 MB flash and the 8 MB PSRAM part.
# PSRAM size and mode are compile-time values (the shared heap lives in a
# linker-reserved window), so this fragment cannot be reused on a 2 MB or
# PSRAM-less module: those use the plain board configuration instead.
#
# Budget policy on this module: data-only buffers are moved to PSRAM through
# src/ext_ram.h; stacks and the UART RX ring stay in internal SRAM because
# Zephyr stacks and interrupt-written rings cannot live in external memory.
# The WiFi adapter heap and packet buffers also stay in DRAM (moving them to
# PSRAM on the C5 made a 2.4 GHz scan take 40 s and never complete).

# --- PSRAM (8 MB, octal) --------------------------------------------------
# The shared multi-heap starts after .ext_ram.bss and fills the rest of the
# part: 7.68 MiB is handed to Zephyr's heap, with ~32 KiB left in reserve for
# the mapped-region bookkeeping. The heap is only capacity: buffers that need
# a fixed home use .ext_ram.bss instead, and nothing is written until it is
# allocated.
CONFIG_ESP_SPIRAM=y
CONFIG_SPIRAM_MODE_OCT=y
CONFIG_SPIRAM_SPEED_80M=y
# SPIRAM_ALLOW_BSS_SEG_EXTERNAL_MEMORY is a hidden symbol and already defaults
# to y for ESP32-S3 in the HAL Kconfig; assigning it here is rejected.
CONFIG_ESP_SPIRAM_HEAP_SIZE=8049120
CONFIG_ESP_SPIRAM_MEMTEST=n
CONFIG_ESP_WIFI_HEAP_SYSTEM=y
# CONFIG_ESP_WIFI_HEAP_SPIRAM=y
# CONFIG_ESP32_WIFI_NET_ALLOC_SPIRAM=y

# --- Enlarged buffers (all in PSRAM except UART RX) -----------------------
# At 115200 baud (8N1) a 32 KiB LAN ring holds about 2.8 seconds of UART
# output while a client is stalled. Use wide indices for these rings.
CONFIG_LINKR_BLE_BRIDGE_UART_RX_BUFFER_SIZE=24576
CONFIG_LINKR_BLE_BRIDGE_BLE_TO_UART_QUEUE_DEPTH=32
CONFIG_BT_BUF_ACL_TX_COUNT=24
CONFIG_NET_BUF_RX_COUNT=48
CONFIG_NET_BUF_TX_COUNT=48
# The internal RAM saved by the data buffers pays for the larger stacks.
CONFIG_MAIN_STACK_SIZE=6144
CONFIG_HTTP_SERVER_STACK_SIZE=5120
CONFIG_LINKR_BLE_BRIDGE_PEER_TX_QUEUE_DEPTH=64
CONFIG_RING_BUFFER_LARGE=y
CONFIG_LINKR_BLE_BRIDGE_LOG_RING_SIZE=131072
CONFIG_LINKR_BLE_BRIDGE_WEBDAV_UPLOAD_CHUNK=65536
CONFIG_LINKR_BLE_BRIDGE_WS_BRIDGE_CLIENT_BUFFER_SIZE=32768
CONFIG_LINKR_BLE_BRIDGE_MGMT_TX_QUEUE_DEPTH=64
