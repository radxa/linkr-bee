# Linkr Bee X1.0 (MV013): SW1 on GPIO3 is the pairing / factory-reset key.
CONFIG_LINKR_BLE_BRIDGE_PAIRING_GPIO_AUTH=y

# Every board advertises Linkr Bee XXXX; XXXX is the last four hex digits of
# the factory hardware MAC. @n can replace the whole name at runtime.
CONFIG_LINKR_BLE_BRIDGE_BLE_NAME_FROM_MAC=y

# Zephyr 4.5: keep a bounded deferred-log queue within the C3 SRAM budget.
CONFIG_LOG_BUFFER_SIZE=4096

# Bee X1.0 high-water measurements on Zephyr 4.5: main 1092 B, logging 732 B
# during BLE queries, WiFi scans and 1.5 Mbaud UART loopback. Keep the other
# boards' budgets until they have equivalent runtime measurements.
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=1024

# BlueZ caches this value and uses it on subsequent connections. The default
# 420 ms expires during short radio stalls; match the 8 s budget on WROOM/C5.
# This changes loss detection, not the connection interval or pairing gate.
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=800
