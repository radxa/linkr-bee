# ESP32-C5 DevKitC, internal SRAM only -- reference fragment, NOT maintained.
#
# The board default enables the module's 8 MB PSRAM and moves data-only buffers
# into it (src/ext_ram.h); this fragment turns all of that back off. It is no
# longer built by CI and links with only ~1.2 KB of sram0_0_seg headroom, so
# treat it as a starting point for a manual experiment rather than a supported
# configuration. See docs/C5_PSRAM.md section 5 for why. Use it explicitly:
#
#   west build -b esp32c5_devkitc/esp32c5/hpcore -d build/c5-sram . \
#       -- -DEXTRA_CONF_FILE=c5_pure_sram.conf
#
# The image has to stay below DRAM_SHARED_BUFFERS_END (0x4085C610): the
# 12.8 KB above it is the ROM stack/bss used by the WiFi/PHY code, and
# borrowing it makes WiFi association hang or locks the chip up. Without PSRAM
# to hold them, the buffers therefore come back to DRAM and the sizes that fit
# in that budget are restored here. They are the only differences from the
# PSRAM default.

CONFIG_ESP_SPIRAM=n
# Same choice as the PSRAM build: the WiFi adapter heap must not live in
# external RAM. Stated explicitly so this fragment stands on its own.
CONFIG_ESP_WIFI_HEAP_SYSTEM=y

# Buffers that live in .ext_ram.bss on the default build.
CONFIG_LINKR_BLE_BRIDGE_PEER_TX_QUEUE_DEPTH=4
CONFIG_LINKR_BLE_BRIDGE_WS_BRIDGE_CLIENT_BUFFER_SIZE=1024
CONFIG_LINKR_BLE_BRIDGE_LOG_RING_SIZE=1024
CONFIG_LINKR_BLE_BRIDGE_WEBDAV_UPLOAD_CHUNK=1024
CONFIG_LINKR_BLE_BRIDGE_UART_RX_BUFFER_SIZE=1024

# Sizing the PSRAM default hands back to the upstream values (db53605 trimmed
# all of it for this variant). Without external RAM it has to be cut again,
# otherwise sram0_0_seg runs into the ROM region above 0x4085C610. The
# headroom measured for each value is recorded in the board conf.
CONFIG_HTTP_SERVER_STACK_SIZE=3072
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=3072
CONFIG_LINKR_BLE_BRIDGE_WIFI_CONNECT_STACK=3072
CONFIG_MAIN_STACK_SIZE=3072
CONFIG_LINKR_BLE_BRIDGE_LOG_UPLOAD_STACK=3072
CONFIG_NET_BUF_RX_COUNT=20
CONFIG_NET_BUF_TX_COUNT=20
CONFIG_NET_PKT_RX_COUNT=10
CONFIG_NET_PKT_TX_COUNT=10
CONFIG_ESP32_WIFI_RX_MGMT_BUF_NUM_DEF=2
CONFIG_ESP32_WIFI_MGMT_SBUF_NUM=6
