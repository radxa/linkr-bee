# dsh-linkr-bee bundle patch — mounts the Linkr Bee tools + console panel.
#
# Connection settings below feed the agent tools (Host half). The Web UI panel
# keeps its own connection entry in the browser and does not read these.
#
#   cliPath       bee-cli executable; empty = auto-detect (LINKR_BEE_CLI env,
#                 the workspace build, then `bee-cli` on PATH)
#   transport     'ble' (auto-discovers a nearby board), 'lan' or 'loopback'
#   lanHost       LAN bridge: host, host:port or ws:// URL (transport: lan)
#   lanToken      LAN access token, 32 hex chars; sent via LINKR_LAN_TOKEN
#   bleAddress    board MAC, e.g. EE:C7:42:34:48:CF (transport: ble)
#   bleName       name fragment when several boards are nearby
#   timeoutMs     per-call budget for one bee-cli request
#   sendCaptureMs how long linkr_bee_send keeps the link open to capture reply
- insert:
    - id: linkr-bee
      name: 'dsh-linkr-bee'
      config:
        cliPath: ''
        transport: ble
        lanHost: ''
        lanToken: ''
        bleAddress: ''
        bleName: ''
        timeoutMs: 30000
        sendCaptureMs: 1500
