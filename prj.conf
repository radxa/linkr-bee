CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Linkr BLE UART-3"
CONFIG_BT_DEVICE_APPEARANCE=833
CONFIG_BT_MAX_CONN=1
CONFIG_BT_ID_MAX=2
CONFIG_BT_ZEPHYR_NUS=y
CONFIG_BT_SMP=n
CONFIG_BT_SETTINGS=y
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=n

CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_USE_RUNTIME_CONFIGURE=y
CONFIG_GPIO=y

# BLE identity and Linkr configuration use Zephyr settings. Linkr ships one
# firmware containing BLE, WiFi, WebDAV, and the WebSocket bridge.
CONFIG_SETTINGS=y
CONFIG_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y

# UART-over-WebSocket LAN bridge (enabled via LINKR_BLE_BRIDGE_WS_BRIDGE).
# Two long-lived WS clients; no need for extra HTTP probing clients.
CONFIG_HTTP_SERVER_MAX_CLIENTS=2
CONFIG_WEBSOCKET_MAX_CONTEXTS=2

# ESP32-C3 controller reports 12 ACL packets; match host contexts to avoid
# resource mismatch that can trigger BLE controller asserts.
CONFIG_BT_BUF_ACL_TX_COUNT=12
# WiFi coexistence increases the Bluetooth host TX call depth. The default
# 1024-byte stack can corrupt bt_tx_processor while notifications are sent.
CONFIG_BT_TX_PROCESSOR_STACK_SIZE=2048
# Management commands can save NVS settings and start/stop network services
# from the Bluetooth receive workqueue. The 1200-byte Zephyr default overflows
# on @s on while persisting the WebSocket setting.
CONFIG_BT_RX_STACK_SIZE=2048

# WebSocket handshake (SHA1) and HTTP server run PSA/crypto code; give them
# generous stack.
CONFIG_HTTP_SERVER_STACK_SIZE=8192

# Increase net_mgmt event queue so WiFi connect/disconnect events are not
# dropped behind scan results.
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=20

# The ESP32 driver's fast connect scan can miss an AP that a user-initiated
# scan has just found. Scan every 2.4 GHz channel and select the strongest
# matching BSSID instead.
CONFIG_ESP32_WIFI_STA_SCAN_ALL=y

# linkr_wifi owns DHCP startup after NET_EVENT_WIFI_CONNECT_RESULT. Disable
# the driver's automatic DHCP path so that it also emits that event instead of
# silently bypassing the application's connection state machine.
CONFIG_ESP32_WIFI_STA_AUTO_DHCPV4=n

# ESP32-C3 shares RAM between WiFi and BLE. This bridge needs modest network
# throughput, so keep WiFi pools bounded and leave enough memory for BLE ACL
# traffic while scanning/connecting.
CONFIG_ESP32_WIFI_STATIC_RX_BUFFER_NUM=6
CONFIG_ESP32_WIFI_DYNAMIC_RX_BUFFER_NUM=12
CONFIG_ESP32_WIFI_DYNAMIC_TX_BUFFER_NUM=12
CONFIG_ESP32_WIFI_RX_MGMT_BUF_NUM_DEF=4
CONFIG_ESP32_WIFI_MGMT_SBUF_NUM=8

# The HTTP/WebSocket bridge uses a TCP listening socket. HTTP_SERVER enables
# the socket API but does not select the TCP transport itself.
CONFIG_NET_TCP=y

# NET_SOCKETS_SERVICE permanently owns one eventfd and the HTTP server needs a
# second one for start/stop wakeups.  The Zephyr default pool only contains one.
CONFIG_ZVFS_EVENTFD_MAX=2

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8192

CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_BUFFER_SIZE=8192

# WiFi driver debug logs to diagnose connect stalls.
CONFIG_WIFI_LOG_LEVEL_DBG=y

# Fail deterministically if a thread ever exhausts its stack instead of
# returning through corrupted memory. Thread names also make fatal logs useful.
CONFIG_STACK_SENTINEL=y
CONFIG_THREAD_NAME=y
